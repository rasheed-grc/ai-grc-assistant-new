[project]
name = "grc-api"
version = "0.1.0"
description = "Rasheed V1 Product API Host (ADR 0052). The single official FastAPI surface that serves every command and query in REST_API_CONTRACT_V1.md. A COMPOSITION ROOT ONLY: it wires Auth, Tenant Context, Read Models, the Mission Engine/Runtime, and the Tool Registry, and shapes HTTP — no business logic lives here (that stays in v2/packages/*). Composes v2 packages exclusively; never imports the old apps/ or packages/ generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pipeline-contracts",
    "mission-read-model",
    "mission-engine",
    "mission-application",
    "deliverables",
    "framework-library",
    "document-read-model",
    "knowledge-runtime",
    "assistant-runtime",
    "mission-store>=0.1.0",
    "event-bus>=0.1.0",
    "governance-discovery",
    "governance-store[postgres]",
    "governance-session",
    "governance-plan-execution",
    # The Wave 1 executor wiring (ADR 0066 §3). These three were dev-only while the production
    # executor was still `EchoExecutor`; `grc_api.execution` now composes them for real, so they
    # are on the production path. `generation-engine` joins them because the draft step needs an
    # actual LLM behind the `GenerationProvider` port.
    "governance-plan-tools",
    "pipeline-tool",
    "tool-registry",
    # The general-purpose tools gap_assessment/risk_assessment/iso_controls/policy_generator/
    # vendor_review resolve their steps to (grc_api/execution.py) — the SAME production path as
    # the three above, for the same reason: real tools now run for real, not just under test.
    "search-tools",
    "llm-tools",
    # BOTH vendor SDKs, because the two LLM roles are deliberately served by different vendors
    # (see grc_api/llm_provider.py): `claude` for the governance role — sector knowledge and plan
    # drafting — and `openai` for the technical tier. The adapters keep their SDKs optional, so a
    # deployment installs only the vendors its roles actually resolve to.
    "generation-engine[openai,claude]",
    # B3: connection pooling. Managed Postgres caps connections aggressively, so the ceiling is
    # connections rather than CPU; a connection per operation is what falls over first under load.
    "psycopg-pool>=3.2.0",
]

[dependency-groups]
# DEV ONLY. `psycopg` and `mission-store` exist here solely so `tests/production` can stand the
# durable adapters up and inspect raw rows out of band.
#
# `governance-plan-tools`/`pipeline-tool`/`tool-registry` USED to live here, while the production
# executor was still `EchoExecutor` and only a test could inject a real one. The Wave 1 executor
# commit has landed (`grc_api.execution`), so they moved to `dependencies` above — the Governance
# Plan Mission now runs for real in the product, not only under test.
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "mission-store",
]

[tool.uv.sources]
pipeline-contracts = { path = "../../packages/pipeline-contracts", editable = true }
mission-read-model = { path = "../../packages/mission-read-model", editable = true }
mission-engine = { path = "../../packages/mission-engine", editable = true }
mission-application = { path = "../../packages/mission-application", editable = true }
deliverables = { path = "../../packages/deliverables", editable = true }
framework-library = { path = "../../packages/framework-library", editable = true }
document-read-model = { path = "../../packages/document-read-model", editable = true }
knowledge-runtime = { path = "../../packages/knowledge-runtime", editable = true }
assistant-runtime = { path = "../../packages/assistant-runtime", editable = true }
# dev-only (tests/production) — not a production dependency yet
mission-store = { path = "../../packages/mission-store", editable = true }
governance-discovery = { path = "../../packages/governance-discovery", editable = true }
governance-store = { path = "../../packages/governance-store", editable = true }
governance-session = { path = "../../packages/governance-session", editable = true }
governance-plan-execution = { path = "../../packages/governance-plan-execution", editable = true }
# dev-only (tests/production) — not a production dependency yet
governance-plan-tools = { path = "../../packages/governance-plan-tools", editable = true }
pipeline-tool = { path = "../../packages/pipeline-tool", editable = true }
tool-registry = { path = "../../packages/tool-registry", editable = true }
search-tools = { path = "../../packages/search-tools", editable = true }
llm-tools = { path = "../../packages/llm-tools", editable = true }
generation-engine = { path = "../../packages/generation-engine", editable = true }

# These ship no py.typed; consume them as untyped imports (our own code stays strict).
[[tool.mypy.overrides]]
module = "mission_engine.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deliverables.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "framework_library.*"
ignore_missing_imports = true

# knowledge-runtime ships py.typed, but its transitive corpus/chunk types come from retrieval-engine
# and knowledge-importer, which do not — consume those as untyped (our own code stays strict).
[[tool.mypy.overrides]]
module = "retrieval_engine.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "knowledge_importer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "assistant_runtime.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grc_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
